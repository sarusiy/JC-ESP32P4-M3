<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle">GPS UART Wiring: Arduino (ArdunioUsbBridgeToCan) &lt;-&gt; P4 (JC-ESP32P4-M3)</text>
  <text x="450" y="52" font-size="13" fill="#555" text-anchor="middle">Companion diagram to electrical drawing.vsdx -- covers the 3rd 10K/15K divider (missing from that drawing) and the P4-&gt;Arduino return line</text>

  <!-- Arduino box -->
  <rect x="40" y="110" width="180" height="120" rx="8" fill="#e8f3ee" stroke="#2f7d5c" stroke-width="2"/>
  <text x="130" y="135" font-size="15" font-weight="bold" text-anchor="middle">Arduino Uno</text>
  <text x="130" y="153" font-size="12" text-anchor="middle" fill="#333">(ArdunioUsbBridgeToCan)</text>
  <text x="130" y="180" font-size="13" text-anchor="middle">D3 (SoftwareSerial TX)</text>
  <text x="130" y="200" font-size="11" fill="#777" text-anchor="middle">5V logic</text>
  <text x="130" y="222" font-size="13" text-anchor="middle">D2 (SoftwareSerial RX)</text>

  <!-- P4 box -->
  <rect x="680" y="110" width="180" height="120" rx="8" fill="#eef1fb" stroke="#38508c" stroke-width="2"/>
  <text x="770" y="135" font-size="15" font-weight="bold" text-anchor="middle">ESP32-P4</text>
  <text x="770" y="153" font-size="12" text-anchor="middle" fill="#333">(JC-ESP32P4-M3), JP1 header</text>
  <text x="770" y="180" font-size="13" text-anchor="middle">GPIO34 (UART1 RX)</text>
  <text x="770" y="200" font-size="11" fill="#777" text-anchor="middle">3.3V-only</text>
  <text x="770" y="222" font-size="13" text-anchor="middle">GPIO35 (UART1 TX)</text>

  <!-- D3 -> divider -> GPIO34 (needs divider) -->
  <line x1="220" y1="175" x2="320" y2="175" stroke="#222" stroke-width="2"/>
  <!-- 10K resistor (zigzag) -->
  <polyline points="320,175 328,168 336,182 344,168 352,182 360,168 368,175" fill="none" stroke="#222" stroke-width="2"/>
  <text x="344" y="158" font-size="13" text-anchor="middle" font-weight="bold">10K</text>
  <line x1="368" y1="175" x2="470" y2="175" stroke="#222" stroke-width="2"/>
  <circle cx="470" cy="175" r="4" fill="#222"/>
  <line x1="470" y1="175" x2="680" y2="175" stroke="#222" stroke-width="2"/>

  <!-- 15K resistor down to GND -->
  <line x1="470" y1="175" x2="470" y2="215" stroke="#222" stroke-width="2"/>
  <polyline points="470,215 463,223 477,231 463,239 477,247 470,255" fill="none" stroke="#222" stroke-width="2"/>
  <text x="500" y="235" font-size="13" font-weight="bold">15K</text>
  <line x1="470" y1="255" x2="470" y2="280" stroke="#222" stroke-width="2"/>
  <!-- ground symbol -->
  <line x1="450" y1="280" x2="490" y2="280" stroke="#222" stroke-width="2"/>
  <line x1="457" y1="288" x2="483" y2="288" stroke="#222" stroke-width="2"/>
  <line x1="464" y1="296" x2="476" y2="296" stroke="#222" stroke-width="2"/>
  <text x="470" y="315" font-size="12" text-anchor="middle" fill="#555">GND</text>

  <text x="344" y="200" font-size="11" fill="#c0392b" text-anchor="middle">divider required: steps 5V TX</text>
  <text x="344" y="213" font-size="11" fill="#c0392b" text-anchor="middle">down to 3.3V-safe RX input</text>

  <!-- GPIO35 -> D2 (no divider needed) -->
  <line x1="680" y1="222" x2="220" y2="222" stroke="#222" stroke-width="2" stroke-dasharray="0"/>
  <text x="450" y="245" font-size="11" fill="#2f7d5c" text-anchor="middle">no divider needed: P4's 3.3V is a valid logic-high for the ATmega328P</text>
  <text x="450" y="260" font-size="11" fill="#777" text-anchor="middle">(currently reserved/unused by the Arduino firmware)</text>

  <!-- Legend / notes -->
  <text x="60" y="360" font-size="12" fill="#333">Same 10K/15K divider topology already used for the MCP2515 MISO/INT lines (see electrical drawing.vsdx),</text>
  <text x="60" y="378" font-size="12" fill="#333">applied here for the same reason: any 5V-driven signal into a 3.3V-only P4 GPIO needs it; P4-driven outputs into 5V inputs don't.</text>
  <text x="60" y="400" font-size="11" fill="#999">Source: Doc/GPS_SIMULATION_AND_INTEGRATION_REQUIREMENTS.md, "Confirmed P4 UART wiring"</text>
</svg>
