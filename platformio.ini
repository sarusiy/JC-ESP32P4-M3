[platformio]
default_envs = jc_esp32p4_m3

[env:jc_esp32p4_m3]
; Official platform-espressif32 has no ESP32-P4 support; pioarduino fork does.
; Use the known-working release for early ESP32-P4 revisions.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = jc_esp32p4_m3
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; GPIO2 is not exposed on this board's connector (internal-only); use a pin
; from the connector's pinout instead so an external LED can be wired up.
build_flags =
  -D LED_GPIO=28
