[platformio]
default_envs = jc_esp32p4_m3

[env:jc_esp32p4_m3]
; Official platform-espressif32 has no ESP32-P4 support; pioarduino fork does.
; Use an older release for better compatibility with early ESP32-P4 revisions.
platform = https://github.com/pioarduino/platform-espressif32.git
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = jc_esp32p4_m3
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; Change LED GPIO if your board routes the on-board LED differently.
build_flags =
  -D LED_GPIO=2
